<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stravelakis — documentation</title>
  <meta name="description" content="Documentation for Stravelakis open-source projects.">
  <style>
    :root { color-scheme: light dark; --ink:#1b1712; --paper:#faf7f2; --line:#e3dccf; --accent:#c26a1c; --muted:#6b6254; }
    @media (prefers-color-scheme: dark) { :root { --ink:#efe7da; --paper:#15120e; --line:#2e2820; --accent:#f2a33c; --muted:#a39884; } }
    body { margin:0; font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
    main { max-width:720px; margin:0 auto; padding:56px 22px 80px; }
    h1 { font-size:1.9rem; margin:0 0 6px; }
    p.lead { color:var(--muted); margin:0 0 36px; }
    a { color:var(--accent); }
    ul { list-style:none; padding:0; margin:0; }
    li { border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:0 0 12px; }
    li a.name { font-weight:650; font-size:1.1rem; text-decoration:none; }
    li p { margin:4px 0 0; color:var(--muted); }
    footer { margin-top:48px; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Stravelakis documentation</h1>
    <p class="lead">Guides for the open-source projects published by Stravelakis.</p>
    <ul>
      <li>
        <a class="name" href="/image-forge/">Image Forge</a>
        <p>Bulk AI image generation from a spreadsheet, using your own API keys. Guides for everyone, for vibe coders, and for developers.</p>
      </li>
    </ul>
    <footer>Source for each project is on <a href="https://github.com/Stravelakis">GitHub</a>.</footer>
  </main>
</body>
</html>
